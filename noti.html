<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotters Spain · Novedades Globales de Aviación</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #050814;
      --card-bg: linear-gradient(145deg, #0c102b, #070a1a);
      --neon-cyan: #00d2ff;
      --neon-green: #00ffcc;
      --neon-red: #ff0055;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: #ffffff;
      min-height: 100vh;
      padding: 12px 10px 70px 10px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      border: 2px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 16px 14px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.2), inset 0 0 15px rgba(0, 210, 255, 0.1);
    }

    h1 {
      font-size: 1.3rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--neon-green);
      font-size: 0.85rem;
      font-weight: 600;
      text-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
    }

    .status {
      margin-top: 10px;
      font-size: 0.72rem;
      color: #88a0c0;
    }

    .filter-group {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .filter-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .filter-box label {
      font-size: 0.75rem;
      color: #88a0c0;
      font-weight: 700;
      min-width: 90px;
      text-align: right;
    }

    .date-select {
      background: #030611;
      color: var(--neon-cyan);
      border: 1.5px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      outline: none;
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.2);
      cursor: pointer;
      max-width: 250px;
      width: 100%;
    }

    button#btn {
      background: var(--neon-cyan);
      color: #050814;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 0 12px var(--neon-cyan);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button#btn:hover {
      background: var(--neon-green);
      box-shadow: 0 0 18px var(--neon-green);
      transform: scale(1.03);
    }

    button#btn:disabled {
      background: #334155;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    .list {
      list-style: none;
    }

    .list li {
      background: var(--card-bg);
      border: 1.5px solid var(--neon-cyan);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
      transition: all 0.3s ease;
    }

    .list li:hover {
      border-color: var(--neon-green);
      box-shadow: 0 0 18px rgba(0, 255, 204, 0.35);
    }

    .source-badge-box {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .source {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--neon-green);
      background: rgba(0, 255, 204, 0.1);
      border: 1px solid var(--neon-green);
      padding: 2px 8px;
      border-radius: 4px;
      box-shadow: 0 0 6px rgba(0, 255, 204, 0.2);
    }

    .lang-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--neon-cyan);
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .title {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.3;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
    }

    .news-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
      display: block;
      border: 1px solid rgba(0, 210, 255, 0.3);
      background: #000000;
    }

    .summary-text {
      font-size: 0.85rem;
      color: #a0b2ce;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .full-article-body {
      display: none;
      font-size: 0.88rem;
      color: #e2e8f0;
      line-height: 1.6;
      margin-top: 10px;
      margin-bottom: 12px;
      padding-top: 10px;
      border-top: 1px dashed rgba(0, 210, 255, 0.3);
    }

    .full-article-body p {
      margin-bottom: 10px;
    }

    .meta {
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toggle-btn {
      background: rgba(0, 210, 255, 0.1);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-btn:hover {
      background: var(--neon-cyan);
      color: #050814;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .loading, .error {
      text-align: center;
      padding: 30px 15px;
      color: #88a0c0;
      list-style: none;
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      color: #556680;
      font-size: 0.72rem;
      line-height: 1.4;
    }

    .btn-float-inicio {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 99999;
      background: #0c102b;
      color: var(--neon-green);
      border: 2px solid var(--neon-green);
      border-radius: 50px;
      padding: 8px 16px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4), inset 0 0 8px rgba(0, 255, 204, 0.2);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .btn-float-inicio:hover, .btn-float-inicio:active {
      background: var(--neon-green);
      color: #050814;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.9);
      transform: scale(1.08) translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fa-solid fa-plane-arrival"></i> Novedades de Aviación</h1>
      <p class="subtitle" id="current-source-title">Aviation Week Network · Feed Global</p>

      <div class="filter-group">
        <div class="filter-box">
          <label for="source-filter"><i class="fa-solid fa-filter"></i> Fuente:</label>
          <select id="source-filter" class="date-select" onchange="changeSource()">
            <option value="aviationweek" selected>Aviation Week (Feed Global RSS)</option>
            <option value="preferente">Preferente (Aerolíneas)</option>
            <option value="aena">Aena (Conexiones y Rutas)</option>
            <option value="airbus">Airbus (Master RSS All Feeds)</option>
            <option value="boeing">Boeing (Entregas y Producción)</option>
          </select>
        </div>

        <div class="filter-box">
          <label for="day-filter"><i class="fa-regular fa-calendar-check"></i> Mostrar:</label>
          <select id="day-filter" class="date-select" onchange="filterAndRender()">
            <option value="all" selected>Todas las noticias</option>
            <option value="1">Últimas 24h (Hoy)</option>
            <option value="2">Últimos 2 días</option>
            <option value="3">Últimos 3 días</option>
            <option value="7">Última semana</option>
          </select>
        </div>
      </div>

      <p class="status" id="status">Obteniendo datos de servidores oficiales...</p>
      <button id="btn"><i class="fa-solid fa-rotate-right"></i> Actualizar ahora</button>
    </header>

    <ul class="list" id="news-list">
      <li class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Cargando noticias oficiales...</li>
    </ul>

    <footer id="footer-source-text">
      Fuente: Aviation Week Network<br>
      Spotters Spain
    </footer>
  </div>

  <a href="index.html" class="btn-float-inicio">
    <i class="fa-solid fa-house"></i> Inicio
  </a>

  <script>
    const SOURCES_CONFIG = {
      aviationweek: {
        name: 'Aviation Week',
        subtitle: 'Aviation Week Network · Feed Oficial Global (Traducido)',
        footer: 'Fuente Oficial: Aviation Week Network RSS',
        url: 'https://aviationweek.com/awn-rss/feed',
        keywords: []
      },
      preferente: {
        name: 'Preferente',
        subtitle: 'Preferente · Noticias de Aerolíneas y Vuelos',
        footer: 'Fuente: Preferente.com',
        url: 'https://www.preferente.com/noticias-de-transportes/noticias-de-aerolineas/feed',
        keywords: []
      },
      aena: {
        name: 'Aena Conexiones',
        subtitle: 'Aena · Rutas, Conexiones y Vuelos Aeroportuarios',
        footer: 'Fuente Oficial: Aena.es (Notas de Conexiones y Pasajeros)',
        url: 'https://www.aena.es/es/prensa/rss.xml',
        keywords: ['ruta', 'rutas', 'conexion', 'conexiones', 'vuelo', 'vuelos', 'pasajeros', 'operaciones', 'destino', 'aerolinea', 'inaugura', 'frecuencia', 'tráfico']
      },
      airbus: {
        name: 'Airbus Master RSS',
        subtitle: 'Airbus · Canal Oficial Todos los Feeds',
        footer: 'Fuente Oficial: Airbus Master Feeds (airbus.com/en/rss-all-feeds)',
        url: 'https://www.airbus.com/en/rss-all-feeds',
        keywords: ['deliver', 'delivers', 'delivery', 'deliveries', 'order', 'orders', 'aircraft', 'a320', 'a321', 'a330', 'a350', 'a220', 'commercial']
      },
      boeing: {
        name: 'Boeing Producción',
        subtitle: 'Boeing · Entregas Comerciales y Ensamblaje',
        footer: 'Fuente Oficial: Boeing Commercial Airplanes RSS',
        url: 'https://boeing.mediaroom.com/all-commercial-airplanes?pagetemplate=rss',
        keywords: ['deliver', 'delivers', 'delivery', 'deliveries', 'order', 'orders', '737', '787', '777', 'max', 'dreamliner', 'first flight', 'commercial']
      }
    };

    let currentSourceKey = 'aviationweek';
    let rawNewsList = [];

    function fetchWithTimeout(url, ms = 8000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), ms);
      return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(id));
    }

    async function translateToCastellano(text) {
      if (!text || text.trim().length === 0) return text;
      try {
        const clean = text.replace(/<[^>]*>/g, ' ');
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q=${encodeURIComponent(clean.substring(0, 800))}`;
        const res = await fetchWithTimeout(url, 3500);
        const data = await res.json();
        if (data && data[0]) {
          return data[0].map(item => item[0]).join('');
        }
      } catch (e) {
        console.warn('Omitida traducción temporal.');
      }
      return text;
    }

    function cleanText(html) {
      if (!html) return '';
      return html
        .replace(/<[^>]*>/g, ' ')
        .replace(/&nbsp;/g, ' ')
        .replace(/&amp;/g, '&')
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/\s+/g, ' ')
        .trim();
    }

    function formatFullArticle(htmlContent) {
      if (!htmlContent) return '';
      let text = htmlContent
        .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
        .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
        .replace(/<iframe[^>]*>[\s\S]*?<\/iframe>/gi, '');

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = text;
      
      const paragraphs = Array.from(tempDiv.querySelectorAll('p'))
        .map(p => p.textContent.trim())
        .filter(t => t.length > 20);

      if (paragraphs.length > 0) {
        return paragraphs.map(p => `<p>${p}</p>`).join('');
      }

      const clean = cleanText(text);
      return `<p>${clean}</p>`;
    }

    function getImageUrl(item) {
      if (item.thumbnail) return item.thumbnail;
      if (item.enclosure && item.enclosure.link) return item.enclosure.link;
      const content = item.content || item.description || '';
      const match = content.match(/<img[^>]+src=["']([^"']+)["']/i);
      return match ? match[1] : null;
    }

    async function fetchFilteredFeed(config) {
      const targetUrl = config.url;
      const proxyEndpoints = [
        `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];

      for (const endpoint of proxyEndpoints) {
        try {
          const res = await fetchWithTimeout(endpoint);
          let items = [];

          if (endpoint.includes('rss2json')) {
            const data = await res.json();
            if (data.status === 'ok' && data.items && data.items.length > 0) {
              items = data.items;
            }
          } else if (endpoint.includes('allorigins')) {
            const data = await res.json();
            if (data.contents) {
              const xml = new DOMParser().parseFromString(data.contents, "text/xml");
              items = parseXmlNodes(xml);
            }
          } else {
            const text = await res.text();
            const xml = new DOMParser().parseFromString(text, "text/xml");
            items = parseXmlNodes(xml);
          }

          if (items.length > 0) {
            let filteredItems = items;
            if (config.keywords && config.keywords.length > 0) {
              filteredItems = items.filter(item => {
                const textToSearch = ((item.title || '') + ' ' + (item.description || '') + ' ' + (item.content || '')).toLowerCase();
                return config.keywords.some(kw => textToSearch.includes(kw));
              });

              if (filteredItems.length === 0) {
                filteredItems = items;
              }
            }

            const targetItems = filteredItems.slice(0, 15);
            const needsTranslation = currentSourceKey !== 'preferente' && currentSourceKey !== 'aena';

            const processed = await Promise.all(targetItems.map(async (item) => {
              const rawBody = item.content || item.description || '';
              let summary = cleanText(rawBody).substring(0, 220);
              if (summary.length >= 220) summary += '...';
              
              let fullBodyFormatted = formatFullArticle(rawBody);
              let title = (item.title || '').trim();

              if (needsTranslation) {
                [title, summary] = await Promise.all([
                  translateToCastellano(title),
                  translateToCastellano(summary)
                ]);
                fullBodyFormatted = `<p>${await translateToCastellano(cleanText(rawBody).substring(0, 600))}</p>`;
              }

              return {
                title,
                link: item.link || '#',
                source: config.name,
                date: item.pubDate ? new Date(item.pubDate).toISOString() : new Date().toISOString(),
                summaryText: summary,
                fullText: fullBodyFormatted,
                image: getImageUrl(item)
              };
            }));

            return processed;
          }
        } catch (e) {
          console.warn(`Falló proxy para ${config.name}: ${endpoint}`);
        }
      }

      return [];
    }

    function parseXmlNodes(xmlDoc) {
      const xmlItems = Array.from(xmlDoc.querySelectorAll("item, entry"));
      return xmlItems.map(node => ({
        title: node.querySelector("title")?.textContent || "",
        link: node.querySelector("link")?.getAttribute("href") || node.querySelector("link")?.textContent || "#",
        pubDate: node.querySelector("pubDate, updated, published")?.textContent || new Date().toISOString(),
        description: node.querySelector("description, content")?.textContent || ""
      }));
    }

    function changeSource() {
      currentSourceKey = document.getElementById('source-filter').value;
      const config = SOURCES_CONFIG[currentSourceKey];
      
      document.getElementById('current-source-title').textContent = config.subtitle;
      document.getElementById('footer-source-text').innerHTML = `${config.footer}<br>Spotters Spain`;

      rawNewsList = [];
      document.getElementById('news-list').innerHTML = `<li class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Conectando al feed de ${config.name}...</li>`;
      loadNews(true);
    }

    function filterAndRender() {
      const filterValue = document.getElementById('day-filter').value;
      let filtered = [...rawNewsList];

      if (filterValue !== 'all') {
        const maxDays = parseInt(filterValue, 10);
        const now = Date.now();
        const maxMs = maxDays * 24 * 60 * 60 * 1000;

        filtered = filtered.filter(item => {
          const itemTime = new Date(item.date).getTime();
          return (now - itemTime) <= maxMs;
        });
      }

      render(filtered);
    }

    function render(news) {
      const list = document.getElementById('news-list');
      if (!news || news.length === 0) {
        list.innerHTML = '<li class="loading"><i class="fa-solid fa-circle-exclamation"></i> No se han encontrado artículos recientes en el rango seleccionado.</li>';
        return;
      }

      list.innerHTML = news.map((item, index) => `
        <li>
          <div class="source-badge-box">
            <span class="source"><i class="fa-solid fa-rss"></i> ${item.source}</span>
            <span class="lang-badge"><i class="fa-solid fa-check"></i> RSS Vivo</span>
          </div>
          ${item.image ? `<img class="news-image" src="${item.image}" alt="${item.title.replace(/"/g, '&quot;')}" loading="lazy" onerror="this.style.display='none'">` : ''}
          <div class="title">${item.title}</div>
          
          <div class="summary-text" id="summary-${index}">
            ${item.summaryText}
          </div>
          
          <div class="full-article-body" id="full-body-${index}">
            ${item.fullText}
          </div>

          <div class="meta">
            <i class="fa-regular fa-calendar-days"></i> 
            ${new Date(item.date).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}
          </div>
          
          <button class="toggle-btn" onclick="toggleNewsBody(${index})" id="btn-${index}" aria-expanded="false">
            <i class="fa-solid fa-book-open"></i> Leer detalle
          </button>
        </li>
      `).join('');
    }

    window.toggleNewsBody = function(index) {
      const summary = document.getElementById(`summary-${index}`);
      const fullBody = document.getElementById(`full-body-${index}`);
      const btn = document.getElementById(`btn-${index}`);

      const isExpanded = fullBody.style.display === 'block';

      if (isExpanded) {
        fullBody.style.display = 'none';
        summary.style.display = 'block';
        btn.setAttribute('aria-expanded', 'false');
        btn.innerHTML = `<i class="fa-solid fa-book-open"></i> Leer detalle`;
      } else {
        fullBody.style.display = 'block';
        summary.style.display = 'none';
        btn.setAttribute('aria-expanded', 'true');
        btn.innerHTML = `<i class="fa-solid fa-chevron-up"></i> Contraer noticia`;
      }
    };

    async function loadNews(forceRefresh = false) {
      const status = document.getElementById('status');
      const btn = document.getElementById('btn');
      const config = SOURCES_CONFIG[currentSourceKey];
      btn.disabled = true;

      status.textContent = `Descargando feed de ${config.name}...`;
      
      let items = await fetchFilteredFeed(config);

      items.sort((a, b) => new Date(b.date) - new Date(a.date));

      const seen = new Set();
      const unique = [];
      for (const item of items) {
        const key = item.title.toLowerCase().slice(0, 45);
        if (!seen.has(key) && item.title.length > 5) {
          seen.add(key);
          unique.push(item);
        }
      }

      rawNewsList = unique;
      filterAndRender();

      if (rawNewsList.length > 0) {
        status.textContent = `Actualizado con éxito · ${rawNewsList.length} publicaciones de ${config.name}`;
      } else {
        status.textContent = `No se pudieron obtener registros en directo de esta fuente.`;
      }

      btn.disabled = false;
    }

    document.getElementById('btn').addEventListener('click', function() {
      loadNews(true);
    });

    loadNews();
  </script>
</body>
</html>
