<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030611" id="meta-theme-color">
  <meta name="description" content="Panel de Administración y Moderación de Avistamientos - Spotters Spain.">
  <title>Administración | Spotters Spain</title>

  <!-- Web App Manifest Inline Data URI -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Spotters Spain","short_name":"Spotters","start_url":".","display":"standalone","background_color":"#030611","theme_color":"#00d2ff"}'>

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap');

    :root {
      --bg-dark: #030611;
      --card-bg-start: rgba(12, 18, 45, 0.85);
      --card-bg-end: rgba(6, 9, 24, 0.92);
      --neon-cyan: #00d2ff;
      --neon-green: #00ffcc;
      --gold-yellow: #ffcc00;
      --accent-red: #ff0055;
      --chart-line: rgba(0, 210, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    /* FONDO DE CARTA NÁUTICA / AERONÁUTICA */
    .nautical-chart-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 204, 0.05) 0%, transparent 50%),
        linear-gradient(var(--chart-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--chart-line) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
    }

    .compass-bg {
      position: fixed;
      top: 15%;
      right: -100px;
      width: 380px;
      height: 380px;
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
      animation: slowRotate 120s linear infinite;
    }

    @keyframes slowRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .app-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 10px 10px 24px 10px;
      max-width: 780px;
      margin: 0 auto;
    }

    .hero-banner {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid rgba(0, 210, 255, 0.5);
      background: linear-gradient(135deg, rgba(12, 20, 45, 0.9) 0%, rgba(5, 10, 25, 0.95) 100%);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
      padding: 12px 14px;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }

    .stripe-top-left {
      position: absolute;
      top: -22px;
      left: -22px;
      width: 58px;
      height: 58px;
      border-bottom: 4px solid var(--neon-cyan);
      border-right: 4px solid var(--neon-cyan);
      transform: rotate(45deg);
      box-shadow: 0 0 10px var(--neon-cyan);
      z-index: 5;
      pointer-events: none;
    }

    /* GRUPO DE BOTONES SUPERIORES DERECHOS */
    .top-buttons-group {
      position: absolute;
      top: 10px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 30;
    }

    .btn-donate {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--gold-yellow);
      background: rgba(255, 204, 0, 0.12);
      border: 1px solid var(--gold-yellow);
      border-radius: 8px;
      padding: 4px 10px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.25);
      animation: pulseDonate 2.5s infinite alternate;
    }

    @keyframes pulseDonate {
      0% { box-shadow: 0 0 6px rgba(255, 204, 0, 0.2); }
      100% { box-shadow: 0 0 14px rgba(255, 204, 0, 0.6); }
    }

    .btn-donate:hover, .btn-donate:active {
      background: var(--gold-yellow);
      color: #030611;
      transform: scale(1.06);
      box-shadow: 0 0 18px rgba(255, 204, 0, 0.9);
    }

    /* SECCIONES ESTILO TARJETA NEÓN */
    .info-card {
      background: linear-gradient(145deg, var(--card-bg-start), var(--card-bg-end));
      border: 1.5px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.15);
      backdrop-filter: blur(8px);
      position: relative;
    }

    .card-header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .card-header-title i {
      color: var(--neon-green);
    }

    .subtitulo {
      color: #cbd5e1;
      font-size: 0.78rem;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    /* INPUTS NEÓN */
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      display: block;
      width: 100%;
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 10px;
      background: rgba(3, 6, 17, 0.7);
      color: #ffffff;
      padding: 11px 13px;
      font-size: 0.85rem;
      font-family: 'Montserrat', sans-serif;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 12px;
    }

    input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    /* BOTONES ACCIÓN NEÓN */
    .btn-action {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.76rem;
      font-weight: 800;
      border-radius: 8px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .btn-blue {
      background: linear-gradient(90deg, #00d2ff, #0099ff);
      color: #030611;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    .btn-blue:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 16px rgba(0, 210, 255, 0.6);
    }

    .btn-green {
      background: linear-gradient(90deg, #00ffcc, #00cc88);
      color: #030611;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .btn-green:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 16px rgba(0, 255, 204, 0.6);
    }

    .btn-yellow {
      background: linear-gradient(90deg, #ffcc00, #ff9900);
      color: #030611;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
    }

    .btn-yellow:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 16px rgba(255, 204, 0, 0.6);
    }

    .btn-red {
      background: linear-gradient(90deg, #ff0055, #cc0044);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    .btn-red:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 16px rgba(255, 0, 85, 0.6);
    }

    .btn-gray {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-gray:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait !important;
      transform: none !important;
      box-shadow: none !important;
    }

    .mensaje {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.4;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .mensaje.error {
      display: block;
      background: rgba(255, 0, 85, 0.12);
      border: 1px solid var(--accent-red);
      color: #ff80a6;
    }

    .mensaje.ok {
      display: block;
      background: rgba(0, 255, 204, 0.12);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
    }

    /* BARRA SUPERIOR Y FILTROS */
    .barra {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    /* TARJETA DE REGISTRO EN PANEL ADMIN */
    .tarjeta {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 210, 255, 0.18);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .tarjeta:hover {
      border-color: rgba(0, 210, 255, 0.4);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.1);
    }

    .tarjeta h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.92rem;
      color: var(--neon-cyan);
      margin-bottom: 8px;
    }

    .detalle {
      color: #94a3b8;
      font-size: 0.75rem;
      line-height: 1.6;
      background: rgba(3, 6, 17, 0.5);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    .descripcion {
      background: rgba(0, 210, 255, 0.04);
      border: 1px solid rgba(0, 210, 255, 0.1);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      color: #e2e8f0;
      line-height: 1.5;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    /* ESTADOS EN BADGES NEÓN */
    .estado {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .estado-pendiente {
      background: rgba(255, 204, 0, 0.12);
      color: var(--gold-yellow);
      border: 1px solid rgba(255, 204, 0, 0.3);
    }

    .estado-verificado {
      background: rgba(0, 255, 204, 0.12);
      color: var(--neon-green);
      border: 1px solid rgba(0, 255, 204, 0.3);
    }

    .estado-no_confirmado {
      background: rgba(255, 0, 85, 0.12);
      color: #ff80a6;
      border: 1px solid rgba(255, 0, 85, 0.3);
    }

    .oculto {
      display: none !important;
    }

    #resumen {
      color: #a0aec0;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .footer-neon {
      margin-top: 10px;
      padding-top: 16px;
      position: relative;
      text-align: center;
    }

    .footer-neon::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--neon-cyan) 30%, var(--neon-green) 70%, transparent 100%);
      box-shadow: 0 0 12px var(--neon-cyan), 0 0 8px var(--neon-green);
    }

    .footer-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    /* Botón Flotante Neón */
    .btn-float-inicio {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 99999;
      background: #0c102b;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      border-radius: 50px;
      padding: 8px 16px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4), inset 0 0 8px rgba(0, 255, 204, 0.2);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-float-inicio:hover, .btn-float-inicio:active {
      background: #00ffcc;
      color: #050814;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.9);
      transform: scale(1.08) translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- COMPASS FONDO CARTA NÁUTICA -->
  <div class="nautical-chart-bg"></div>
  <svg class="compass-bg" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="none" stroke="#00d2ff" stroke-width="0.5" stroke-dasharray="1,1"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="#00ffcc" stroke-width="0.3"/>
    <path d="M50,2 L54,42 L98,50 L54,58 L50,98 L46,58 L2,50 L46,42 Z" fill="none" stroke="#00d2ff" stroke-width="0.5"/>
  </svg>

  <!-- BOTÓN FLOTANTE ATRÁS -->
  <button class="btn-float-inicio" onclick="volverAtras()">
    <i class="fa-solid fa-arrow-left"></i> Atrás
  </button>

  <div class="app-wrapper">

    <!-- CABECERA DE LA PÁGINA -->
    <header class="hero-banner">
      <div class="stripe-top-left"></div>
      
      <!-- GRUPO DE BOTONES SUPERIORES DERECHOS -->
      <div class="top-buttons-group">
        
        </a>
      </div>

      <div class="relative z-10 flex items-center gap-3 pr-40">
        <div class="w-14 h-14 rounded-full border-2 border-cyan-400 bg-black/60 flex items-center justify-center shadow-lg shadow-cyan-500/30">
          <i class="fa-solid fa-user-shield text-2xl text-cyan-400"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-xl font-extrabold text-white tracking-tight leading-tight">
            Administración
          </h1>
          <p class="text-xs text-slate-300 font-medium">
            Gestión y verificación privada de avistamientos
          </p>
        </div>
      </div>
    </header>

    <!-- PANEL LOGIN -->
    <section class="info-card" id="panelLogin">
      <div class="card-header-title">
        <i class="fa-solid fa-lock text-emerald-400"></i> Acceso de administrador
      </div>
      <p class="subtitulo">
        Inicia sesión con la cuenta autorizada para moderar los avistamientos registrados en el sistema.
      </p>

      <form id="formLogin">
        <input
          type="email"
          id="email"
          placeholder="Correo electrónico"
          autocomplete="username"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          required
        >

        <button class="btn-action btn-blue w-full mt-2" id="btnLogin" type="submit">
          <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
        </button>
      </form>

      <div id="mensajeLogin" class="mensaje"></div>
    </section>

    <!-- PANEL ADMINISTRACIÓN -->
    <section id="panelAdmin" class="info-card oculto">
      <div class="barra">
        <div>
          <div class="card-header-title" style="border:none; padding:0; margin:0;">
            <i class="fa-solid fa-list-check text-emerald-400"></i> Gestión de avistamientos
          </div>
          <div id="resumen">Cargando registros...</div>
        </div>

        <div class="flex flex-wrap gap-1">
          <button class="btn-action btn-blue" id="btnActualizar">
            <i class="fa-solid fa-rotate"></i> Actualizar
          </button>

          <button class="btn-action btn-gray" id="btnSalir">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Salir
          </button>
        </div>
      </div>

      <div class="filtros">
        <button class="btn-action btn-gray" data-filtro="todos"><i class="fa-solid fa-border-all"></i> Todos</button>
        <button class="btn-action btn-yellow" data-filtro="pendiente"><i class="fa-solid fa-clock"></i> Pendientes</button>
        <button class="btn-action btn-green" data-filtro="verificado"><i class="fa-solid fa-circle-check"></i> Verificados</button>
        <button class="btn-action btn-red" data-filtro="no_confirmado"><i class="fa-solid fa-circle-xmark"></i> No confirmados</button>
      </div>

      <div id="mensajeAdmin" class="mensaje"></div>
      <div id="lista" class="mt-3"></div>
    </section>

    <!-- FOOTER NEÓN -->
    <footer class="footer-neon">
      <p class="footer-text">Spotters Spain · Administración Privada 2026</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    /* CONFIGURACIÓN DE SUPABASE */
    const SUPABASE_URL = "https://oxqgceyugjahicnqgtsq.supabase.co";
    const SUPABASE_PUBLIC_KEY = "sb_publishable_lgtVKnJK13fqwR2xIazsiA_nXRcwO_T";
    const ADMIN_UID = "be82ed2b-d483-438a-bf9f-8d9500a527d2";

    const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY);

    const panelLogin = document.getElementById("panelLogin");
    const panelAdmin = document.getElementById("panelAdmin");
    const formLogin = document.getElementById("formLogin");
    const mensajeLogin = document.getElementById("mensajeLogin");
    const mensajeAdmin = document.getElementById("mensajeAdmin");
    const lista = document.getElementById("lista");
    const resumen = document.getElementById("resumen");

    let filtroActual = "todos";
    let registros = [];
    let trabajando = false;

    function volverAtras() {
      if (document.referrer && document.referrer !== window.location.href) {
        window.location.href = document.referrer;
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }

    function mostrarMensaje(elemento, texto, tipo) {
      elemento.textContent = texto;
      elemento.className = "mensaje " + tipo;
    }

    function ocultarMensaje(elemento) {
      elemento.textContent = "";
      elemento.className = "mensaje";
    }

    async function comprobarAdministrador(usuario) {
      if (!usuario || usuario.id !== ADMIN_UID) {
        await cliente.auth.signOut();
        panelAdmin.classList.add("oculto");
        panelLogin.classList.remove("oculto");
        mostrarMensaje(mensajeLogin, "Esta cuenta no tiene autorización para acceder al panel de administración.", "error");
        return false;
      }

      panelLogin.classList.add("oculto");
      panelAdmin.classList.remove("oculto");
      ocultarMensaje(mensajeLogin);
      await cargarAvistamientos();
      return true;
    }

    formLogin.addEventListener("submit", async function(evento) {
      evento.preventDefault();

      if (!SUPABASE_PUBLIC_KEY.startsWith("sb_publishable_")) {
        mostrarMensaje(mensajeLogin, "Configura primero la clave publicable de Supabase en el código.", "error");
        return;
      }

      const boton = document.getElementById("btnLogin");
      boton.disabled = true;
      boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Comprobando acceso...';

      ocultarMensaje(mensajeLogin);

      try {
        const { data, error } = await cliente.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) throw error;
        const autorizado = await comprobarAdministrador(data.user);
        if (!autorizado) return;

      } catch (error) {
        mostrarMensaje(mensajeLogin, "No se pudo iniciar sesión: " + error.message, "error");
      } finally {
        boton.disabled = false;
        boton.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión';
      }
    });

    async function iniciarPanel() {
      if (!SUPABASE_PUBLIC_KEY.startsWith("sb_publishable_")) {
        mostrarMensaje(mensajeLogin, "Falta configurar la clave publicable de Supabase.", "error");
        return;
      }

      try {
        const { data, error } = await cliente.auth.getSession();
        if (error) throw error;
        if (data.session) {
          await comprobarAdministrador(data.session.user);
        }
      } catch (error) {
        mostrarMensaje(mensajeLogin, "No se pudo comprobar la sesión: " + error.message, "error");
      }
    }

    async function cargarAvistamientos() {
      lista.textContent = "Cargando avistamientos...";
      resumen.textContent = "Consultando base de datos...";

      try {
        const { data, error } = await cliente
          .from("avistamientos")
          .select("*")
          .order("creado_en", { ascending: false });

        if (error) throw error;

        registros = data || [];
        pintarLista();
        ocultarMensaje(mensajeAdmin);

      } catch (error) {
        lista.textContent = "";
        mostrarMensaje(mensajeAdmin, "No se pudieron cargar los registros: " + error.message, "error");
        resumen.textContent = "Error al cargar";
      }
    }

    function pintarLista() {
      lista.textContent = "";

      const pendientes = registros.filter(r => r.estado === "pendiente").length;
      const verificados = registros.filter(r => r.estado === "verificado").length;
      const noConfirmados = registros.filter(r => r.estado === "no_confirmado").length;

      resumen.textContent =
        registros.length + " registros · " +
        pendientes + " pendientes · " +
        verificados + " verificados · " +
        noConfirmados + " no confirmados";

      const visibles = registros.filter(r =>
        filtroActual === "todos" || r.estado === filtroActual
      );

      if (visibles.length === 0) {
        const vacio = document.createElement("p");
        vacio.className = "subtitulo mt-2";
        vacio.textContent = "No hay avistamientos en esta categoría.";
        lista.appendChild(vacio);
        return;
      }

      visibles.forEach(registro => {
        const tarjeta = document.createElement("article");
        tarjeta.className = "tarjeta";

        const estado = document.createElement("span");
        estado.className = "estado estado-" + registro.estado;
        estado.textContent = nombreEstado(registro.estado);
        tarjeta.appendChild(estado);

        const titulo = document.createElement("h3");
        titulo.textContent =
          (registro.aeronave || "Aeronave no especificada") +
          " · " + (registro.aeropuerto || "Aeropuerto no especificado");

        tarjeta.appendChild(titulo);

        const detalle = document.createElement("div");
        detalle.className = "detalle";

        const fecha = registro.fecha_avistamiento
          ? new Date(registro.fecha_avistamiento).toLocaleString("es-ES")
          : "No especificada";

        detalle.textContent =
          "📅 Fecha del avistamiento: " + fecha +
          "\n✈️ Matrícula: " + (registro.matricula || "No indicada") +
          "\n🏢 Compañía: " + (registro.compania || "No indicada") +
          "\n🏷️ Categoría: " + (registro.categoria || "No indicada") +
          "\n🔑 ID: " + registro.id;

        tarjeta.appendChild(detalle);

        const descripcion = document.createElement("p");
        descripcion.className = "descripcion";
        descripcion.textContent = registro.descripcion || "Sin descripción.";

        tarjeta.appendChild(descripcion);

        const acciones = document.createElement("div");
        acciones.style.marginTop = "10px";

        if (registro.estado !== "verificado") {
          acciones.appendChild(crearBoton(
            "✅ Verificar y publicar",
            "btn-action btn-green",
            () => cambiarEstado(registro.id, "verificado")
          ));
        }

        if (registro.estado !== "no_confirmado") {
          acciones.appendChild(crearBoton(
            "⚠️ No confirmado",
            "btn-action btn-yellow",
            () => cambiarEstado(registro.id, "no_confirmado")
          ));
        }

        acciones.appendChild(crearBoton(
          "🗑️ Eliminar",
          "btn-action btn-red",
          () => eliminarRegistro(registro.id)
        ));

        tarjeta.appendChild(acciones);
        lista.appendChild(tarjeta);
      });
    }

    function nombreEstado(estado) {
      const nombres = {
        pendiente: "⏳ PENDIENTE",
        verificado: "✅ VERIFICADO",
        no_confirmado: "⚠️ NO CONFIRMADO"
      };
      return nombres[estado] || estado;
    }

    function crearBoton(texto, clase, accion) {
      const boton = document.createElement("button");
      boton.type = "button";
      boton.className = clase;
      boton.textContent = texto;
      boton.addEventListener("click", accion);
      return boton;
    }

    async function cambiarEstado(id, nuevoEstado) {
      if (trabajando) return;

      const mensaje = nuevoEstado === "verificado"
        ? "¿Confirmas que quieres verificar y publicar este avistamiento?"
        : "¿Quieres marcar este avistamiento como no confirmado?";

      if (!confirm(mensaje)) return;

      trabajando = true;

      try {
        const { data: usuarioData, error: usuarioError } = await cliente.auth.getUser();
        if (usuarioError) throw usuarioError;

        if (!usuarioData.user || usuarioData.user.id !== ADMIN_UID) {
          throw new Error("No tienes autorización de administrador.");
        }

        const { error } = await cliente
          .from("avistamientos")
          .update({ estado: nuevoEstado })
          .eq("id", id);

        if (error) throw error;

        mostrarMensaje(
          mensajeAdmin,
          nuevoEstado === "verificado"
            ? "Avistamiento verificado y publicado correctamente."
            : "Avistamiento marcado como no confirmado.",
          "ok"
        );

        await cargarAvistamientos();

      } catch (error) {
        mostrarMensaje(mensajeAdmin, "No se pudo cambiar el estado: " + error.message, "error");
      } finally {
        trabajando = false;
      }
    }

    async function eliminarRegistro(id) {
      if (trabajando) return;

      if (!confirm("¿Seguro que quieres eliminar este avistamiento? Esta acción no se puede deshacer.")) return;

      trabajando = true;

      try {
        const { data: usuarioData, error: usuarioError } = await cliente.auth.getUser();
        if (usuarioError) throw usuarioError;

        if (!usuarioData.user || usuarioData.user.id !== ADMIN_UID) {
          throw new Error("No tienes autorización de administrador.");
        }

        const { error } = await cliente
          .from("avistamientos")
          .delete()
          .eq("id", id);

        if (error) throw error;

        mostrarMensaje(mensajeAdmin, "Avistamiento eliminado correctamente.", "ok");
        await cargarAvistamientos();

      } catch (error) {
        mostrarMensaje(mensajeAdmin, "No se pudo eliminar el registro: " + error.message, "error");
      } finally {
        trabajando = false;
      }
    }

    document.querySelectorAll("[data-filtro]").forEach(boton => {
      boton.addEventListener("click", function() {
        filtroActual = this.dataset.filtro;
        pintarLista();
      });
    });

    document.getElementById("btnActualizar").addEventListener("click", cargarAvistamientos);

    document.getElementById("btnSalir").addEventListener("click", async function() {
      await cliente.auth.signOut();
      registros = [];
      lista.textContent = "";
      panelAdmin.classList.add("oculto");
      panelLogin.classList.remove("oculto");
      document.getElementById("password").value = "";
      mostrarMensaje(mensajeLogin, "Has cerrado la sesión correctamente.", "ok");
    });

    iniciarPanel();
  </script>

  <!-- MOTOR SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http') && !window.location.href.startsWith('blob:')) {
      window.addEventListener('load', () => {
        try {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker cargado con éxito:', reg.scope))
            .catch(err => console.warn('Service Worker no activo:', err.message || err));
        } catch (err) {
          console.warn('Omitiendo Service Worker:', err.message || err);
        }
      });
    }
  </script>
</body>
