<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030611" id="meta-theme-color">
  <meta name="description" content="Panel de Administración y Moderación de Avistamientos - Spotters Spain.">
  <title>Administración | Spotters Spain</title>

  <link rel="manifest" href='data:application/manifest+json,{"name":"Spotters Spain","short_name":"Spotters","start_url":".","display":"standalone","background_color":"#030611","theme_color":"#00d2ff"}'>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap');

    :root {
      --bg-dark: #030611;
      --card-bg-start: rgba(12, 18, 45, 0.85);
      --card-bg-end: rgba(6, 9, 24, 0.92);
      --neon-cyan: #00d2ff;
      --neon-green: #00ffcc;
      --gold-yellow: #ffcc00;
      --accent-red: #ff0055;
      --chart-line: rgba(0, 210, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    .nautical-chart-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 50% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 204, 0.05) 0%, transparent 50%),
        linear-gradient(var(--chart-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--chart-line) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
    }

    .compass-bg {
      position: fixed;
      top: 15%;
      right: -100px;
      width: 380px;
      height: 380px;
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
      animation: slowRotate 120s linear infinite;
    }

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 10px 10px 24px;
      max-width: 780px;
      margin: 0 auto;
    }

    .hero-banner {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid rgba(0, 210, 255, 0.5);
      background: linear-gradient(135deg, rgba(12, 20, 45, 0.9) 0%, rgba(5, 10, 25, 0.95) 100%);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
      padding: 12px 14px;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }

    .stripe-top-left {
      position: absolute;
      top: -22px;
      left: -22px;
      width: 58px;
      height: 58px;
      border-bottom: 4px solid var(--neon-cyan);
      border-right: 4px solid var(--neon-cyan);
      transform: rotate(45deg);
      box-shadow: 0 0 10px var(--neon-cyan);
      z-index: 5;
      pointer-events: none;
    }

    .info-card {
      background: linear-gradient(145deg, var(--card-bg-start), var(--card-bg-end));
      border: 1.5px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.15);
      backdrop-filter: blur(8px);
      position: relative;
      min-width: 0;
    }

    .card-header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .card-header-title i {
      color: var(--neon-green);
    }

    .subtitulo {
      color: #cbd5e1;
      font-size: 0.78rem;
      line-height: 1.5;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }

    input[type="email"],
    input[type="password"],
    select {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 10px;
      background: rgba(3, 6, 17, 0.85);
      color: #ffffff;
      padding: 9px 12px;
      font-size: 0.82rem;
      font-family: 'Montserrat', sans-serif;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 10px;
    }

    select option {
      background: #060918;
      color: #ffffff;
    }

    input:focus, select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    /* BOTONES PEQUEÑOS Y COMPACTOS */
    .btn-action {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      border-radius: 6px;
      padding: 5px 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border: none;
      margin-right: 4px;
      margin-bottom: 4px;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .btn-blue {
      background: linear-gradient(90deg, #00d2ff, #0099ff);
      color: #030611;
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.25);
    }

    .btn-blue:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
    }

    .btn-green {
      background: linear-gradient(90deg, #00ffcc, #00cc88);
      color: #030611;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.25);
    }

    .btn-green:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
    }

    .btn-yellow {
      background: linear-gradient(90deg, #ffcc00, #ff9900);
      color: #030611;
      box-shadow: 0 0 8px rgba(255, 204, 0, 0.25);
    }

    .btn-yellow:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
    }

    .btn-red {
      background: linear-gradient(90deg, #ff0055, #cc0044);
      color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.25);
    }

    .btn-red:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
    }

    .btn-gray {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-gray:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait !important;
      transform: none !important;
      box-shadow: none !important;
    }

    .mensaje {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.4;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .mensaje.error {
      display: block;
      background: rgba(255, 0, 85, 0.12);
      border: 1px solid var(--accent-red);
      color: #ff80a6;
    }

    .mensaje.ok {
      display: block;
      background: rgba(0, 255, 204, 0.12);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
    }

    .barra {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 10px;
    }

    /* CONTENEDOR GRID DE DESPLEGABLES DE FILTRO */
    .grid-desplegables {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .tarjeta {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 210, 255, 0.18);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .tarjeta:hover {
      border-color: rgba(0, 210, 255, 0.4);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.1);
    }

    .tarjeta h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: var(--neon-cyan);
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }

    .detalle {
      color: #94a3b8;
      font-size: 0.72rem;
      line-height: 1.5;
      background: rgba(3, 6, 17, 0.5);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .descripcion {
      background: rgba(0, 210, 255, 0.04);
      border: 1px solid rgba(0, 210, 255, 0.1);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.74rem;
      color: #e2e8f0;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-bottom: 10px;
    }

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.62rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
    }

    .estado-pendiente {
      background: rgba(255, 204, 0, 0.12);
      color: var(--gold-yellow);
      border: 1px solid rgba(255, 204, 0, 0.3);
    }

    .estado-verificado {
      background: rgba(0, 255, 204, 0.12);
      color: var(--neon-green);
      border: 1px solid rgba(0, 255, 204, 0.3);
    }

    .estado-no_confirmado {
      background: rgba(255, 0, 85, 0.12);
      color: #ff80a6;
      border: 1px solid rgba(255, 0, 85, 0.3);
    }

    .oculto {
      display: none !important;
    }

    #resumen {
      color: #a0aec0;
      font-size: 0.72rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .footer-neon {
      margin-top: 10px;
      padding-top: 16px;
      position: relative;
      text-align: center;
    }

    .footer-neon::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--neon-cyan) 30%, var(--neon-green) 70%, transparent 100%);
      box-shadow: 0 0 12px var(--neon-cyan), 0 0 8px var(--neon-green);
    }

    .footer-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    .btn-float-inicio {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 99999;
      background: #0c102b;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      border-radius: 50px;
      padding: 6px 14px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4), inset 0 0 8px rgba(0, 255, 204, 0.2);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-float-inicio:hover,
    .btn-float-inicio:active {
      background: #00ffcc;
      color: #050814;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.9);
      transform: scale(1.08) translateY(-2px);
    }

    @media (max-width: 520px) {
      .grid-desplegables {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
      }
    }

    @media (max-width: 420px) {
      .app-wrapper {
        padding-left: 8px;
        padding-right: 8px;
      }

      .info-card {
        padding: 12px;
      }

      .barra {
        align-items: flex-start;
      }

      .btn-action {
        font-size: 0.64rem;
        padding: 5px 7px;
        letter-spacing: 0.1px;
      }

      .btn-float-inicio {
        bottom: 12px;
        right: 12px;
      }
    }
  </style>

<body>

  <div class="app-wrapper">

    <header class="hero-banner">

      <div class="relative z-10 flex items-center gap-3 pr-40">
        <div class="w-14 h-14 rounded-full border-2 border-cyan-400 bg-black/60 flex items-center justify-center shadow-lg shadow-cyan-500/30">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    /* CONFIGURACIÓN DE SUPABASE */
    const SUPABASE_URL = "https://oxqgceyugjahicnqgtsq.supabase.co";
    const SUPABASE_PUBLIC_KEY = "sb_publishable_lgtVKnJK13fqwR2xIazsiA_nXRcwO_T";

    const cliente = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    const panelLogin = document.getElementById("panelLogin");
    const panelAdmin = document.getElementById("panelAdmin");
    const formLogin = document.getElementById("formLogin");
    const mensajeLogin = document.getElementById("mensajeLogin");
    const mensajeAdmin = document.getElementById("mensajeAdmin");
    const lista = document.getElementById("lista");
    const resumen = document.getElementById("resumen");
    const rolSesion = document.getElementById("rolSesion");
    
    /* ELEMENTOS SELECT DE FILTRO */
    const filtroAeropuerto = document.getElementById("filtroAeropuerto");
    const filtroCategoria = document.getElementById("filtroCategoria");

    let filtroActual = "todos";
    let aeropuertoSeleccionado = "";
    let categoriaSeleccionada = "";
    let registros = [];
    let trabajando = false;
    let rolActual = null;

    function volverAtras() {
      if (
        document.referrer &&
        document.referrer !== window.location.href
      ) {
        window.location.href = document.referrer;
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    }

    function mostrarMensaje(elemento, texto, tipo) {
      elemento.textContent = texto;
      elemento.className = "mensaje " + tipo;
    }

    function ocultarMensaje(elemento) {
      elemento.textContent = "";
      elemento.className = "mensaje";
    }

    async function obtenerRolModeracion(usuario) {
      if (!usuario) {
        return null;
      }

      const { data, error } = await cliente
        .from("user_roles")
        .select("role")
        .eq("user_id", usuario.id)
        .maybeSingle();

      if (error) {
        throw error;
      }

      if (!data || typeof data.role !== "string") {
        return null;
      }

      const rol = data.role.trim().toLowerCase();

      if (rol !== "admin" && rol !== "moderador") {
        return null;
      }

      return rol;
    }

    async function comprobarAdministrador(usuario) {
      try {
        const rol = await obtenerRolModeracion(usuario);

        if (!rol) {
          await cliente.auth.signOut();

          rolActual = null;
          rolSesion.textContent = "";

          panelAdmin.classList.add("oculto");
          panelLogin.classList.remove("oculto");

          mostrarMensaje(
            mensajeLogin,
            "Esta cuenta no tiene autorización para acceder al panel de moderación. Comprueba que tenga asignado el rol admin o moderador.",
            "error"
          );

          return false;
        }

        rolActual = rol;

        panelLogin.classList.add("oculto");
        panelAdmin.classList.remove("oculto");

        rolSesion.textContent = rol === "admin"
          ? "Sesión iniciada: Administrador"
          : "Sesión iniciada: Moderador";

        ocultarMensaje(mensajeLogin);

        await cargarAvistamientos();

        return true;

      } catch (error) {
        console.error("Error comprobando el rol:", error);

        rolActual = null;
        rolSesion.textContent = "";

        await cliente.auth.signOut();

        panelAdmin.classList.add("oculto");
        panelLogin.classList.remove("oculto");

        mostrarMensaje(
          mensajeLogin,
          "No se pudo comprobar tu autorización: " + error.message,
          "error"
        );

        return false;
      }
    }

    /* INICIO DE SESIÓN */
    formLogin.addEventListener("submit", async function(evento) {
      evento.preventDefault();

      if (!SUPABASE_PUBLIC_KEY.startsWith("sb_publishable_")) {
        mostrarMensaje(
          mensajeLogin,
          "Configura primero la clave publicable de Supabase en el código.",
          "error"
        );
        return;
      }

      const boton = document.getElementById("btnLogin");

      boton.disabled = true;
      boton.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Comprobando acceso...';

      ocultarMensaje(mensajeLogin);

      try {
        const { data, error } = await cliente.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) {
          throw error;
        }

        const autorizado = await comprobarAdministrador(data.user);

        if (!autorizado) {
          return;
        }

      } catch (error) {
        mostrarMensaje(
          mensajeLogin,
          "No se pudo iniciar sesión: " + error.message,
          "error"
        );

      } finally {
        boton.disabled = false;
        boton.innerHTML =
          '<i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión';
      }
    });

    /* RECUPERAR SESIÓN EXISTENTE */
    async function iniciarPanel() {
      if (!SUPABASE_PUBLIC_KEY.startsWith("sb_publishable_")) {
        mostrarMensaje(
          mensajeLogin,
          "Falta configurar la clave publicable de Supabase.",
          "error"
        );
        return;
      }

      try {
        const { data, error } = await cliente.auth.getSession();

        if (error) {
          throw error;
        }

        if (data.session) {
          await comprobarAdministrador(data.session.user);
        }

      } catch (error) {
        mostrarMensaje(
          mensajeLogin,
          "No se pudo comprobar la sesión: " + error.message,
          "error"
        );
      }
    }

    /* RECARGAR Y CONSULTAR AVISTAMIENTOS */
    async function cargarAvistamientos() {
      lista.textContent = "Cargando avistamientos...";
      resumen.textContent = "Consultando base de datos...";

      try {
        const { data: usuarioData, error: usuarioError } =
          await cliente.auth.getUser();

        if (usuarioError) {
          throw usuarioError;
        }

        if (!usuarioData.user) {
          throw new Error("Tu sesión ha caducado. Vuelve a iniciar sesión.");
        }

        const rol = await obtenerRolModeracion(usuarioData.user);

        if (!rol) {
          throw new Error("Tu cuenta ya no tiene permisos de moderación.");
        }

        rolActual = rol;

        const { data, error } = await cliente
          .from("avistamientos")
          .select("*")
          .order("creado_en", { ascending: false });

        if (error) {
          throw error;
        }

        registros = data || [];

        pintarLista();
        ocultarMensaje(mensajeAdmin);

      } catch (error) {
        lista.textContent = "";

        mostrarMensaje(
          mensajeAdmin,
          "No se pudieron cargar los registros: " + error.message,
          "error"
        );

        resumen.textContent = "Error al cargar";
      }
    }

    /* DIBUJAR LISTA Y APLICAR FILTROS (ESTADO, AEROPUERTO Y CATEGORÍA) */
    function pintarLista() {
      lista.textContent = "";

      const pendientes = registros.filter(
        r => r.estado === "pendiente"
      ).length;

      const verificados = registros.filter(
        r => r.estado === "verificado"
      ).length;

      const noConfirmados = registros.filter(
        r => r.estado === "no_confirmado"
      ).length;

      resumen.textContent =
        registros.length + " registros · " +
        pendientes + " pendientes · " +
        verificados + " verificados · " +
        noConfirmados + " no confirmados";

      const visibles = registros.filter(r => {
        const cumpleEstado = (filtroActual === "todos" || r.estado === filtroActual);
        if (!cumpleEstado) return false;

        if (aeropuertoSeleccionado && r.aeropuerto !== aeropuertoSeleccionado) {
          return false;
        }

        if (categoriaSeleccionada && r.categoria !== categoriaSeleccionada) {
          return false;
        }

        return true;
      });

      if (visibles.length === 0) {
        const vacio = document.createElement("p");
        vacio.className = "subtitulo mt-2";
        vacio.textContent = (aeropuertoSeleccionado || categoriaSeleccionada)
          ? "No se han encontrado avistamientos que coincidan con los filtros seleccionados."
          : "No hay avistamientos en esta categoría.";
        lista.appendChild(vacio);
        return;
      }

      visibles.forEach(registro => {
        const tarjeta = document.createElement("article");
        tarjeta.className = "tarjeta";

        const estado = document.createElement("span");
        estado.className = "estado estado-" + registro.estado;
        estado.textContent = nombreEstado(registro.estado);
        tarjeta.appendChild(estado);

        const titulo = document.createElement("h3");

        titulo.textContent =
          (registro.aeronave || "Aeronave no especificada") +
          " · " +
          (registro.aeropuerto || "Aeropuerto no especificado");

        tarjeta.appendChild(titulo);

        const detalle = document.createElement("div");
        detalle.className = "detalle";

        const fecha = registro.fecha_avistamiento
          ? new Date(registro.fecha_avistamiento).toLocaleString("es-ES")
          : "No especificada";

        detalle.textContent =
          "📅 Fecha del avistamiento: " + fecha +
          "\n✈️ Matrícula: " + (registro.matricula || "No indicada") +
          "\n🏢 Compañía: " + (registro.compania || "No indicada") +
          "\n🏷️ Categoría: " + (registro.categoria || "No indicada") +
          "\n🔑 ID: " + registro.id;

        tarjeta.appendChild(detalle);

        const descripcion = document.createElement("p");
        descripcion.className = "descripcion";
        descripcion.textContent =
          registro.descripcion || "Sin descripción.";

        tarjeta.appendChild(descripcion);

        const acciones = document.createElement("div");
        acciones.style.marginTop = "8px";

        if (registro.estado !== "verificado") {
          acciones.appendChild(crearBoton(
            "✅ Verificar y publicar",
            "btn-action btn-green",
            () => cambiarEstado(registro.id, "verificado")
          ));
        }

        if (registro.estado !== "no_confirmado") {
          acciones.appendChild(crearBoton(
            "⚠️ No confirmado",
            "btn-action btn-yellow",
            () => cambiarEstado(registro.id, "no_confirmado")
          ));
        }

        acciones.appendChild(crearBoton(
          "🗑️ Eliminar",
          "btn-action btn-red",
          () => eliminarRegistro(registro.id)
        ));

        tarjeta.appendChild(acciones);
        lista.appendChild(tarjeta);
      });
    }

    function nombreEstado(estado) {
      const nombres = {
        pendiente: "⏳ PENDIENTE",
        verificado: "✅ VERIFICADO",
        no_confirmado: "⚠️ NO CONFIRMADO"
      };

      return nombres[estado] || estado;
    }

    function crearBoton(texto, clase, accion) {
      const boton = document.createElement("button");

      boton.type = "button";
      boton.className = clase;
      boton.textContent = texto;
      boton.addEventListener("click", accion);

      return boton;
    }

    async function cambiarEstado(id, nuevoEstado) {
      if (trabajando) {
        return;
      }

      if (!["verificado", "no_confirmado"].includes(nuevoEstado)) {
        mostrarMensaje(
          mensajeAdmin,
          "El estado solicitado no es válido.",
          "error"
        );
        return;
      }

      const mensaje = nuevoEstado === "verificado"
        ? "¿Confirmas que quieres verificar y publicar este avistamiento?"
        : "¿Quieres marcar este avistamiento como no confirmado?";

      if (!confirm(mensaje)) {
        return;
      }

      trabajando = true;

      try {
        const { data: usuarioData, error: usuarioError } =
          await cliente.auth.getUser();

        if (usuarioError) {
          throw usuarioError;
        }

        const rol = await obtenerRolModeracion(usuarioData.user);

        if (!rol) {
          throw new Error(
            "No tienes autorización para moderar avistamientos."
          );
        }

        const { error } = await cliente
          .from("avistamientos")
          .update({ estado: nuevoEstado })
          .eq("id", id);

        if (error) {
          throw error;
        }

        mostrarMensaje(
          mensajeAdmin,
          nuevoEstado === "verificado"
            ? "Avistamiento verificado y publicado correctamente."
            : "Avistamiento marcado como no confirmado.",
          "ok"
        );

        await cargarAvistamientos();

      } catch (error) {
        mostrarMensaje(
          mensajeAdmin,
          "No se pudo cambiar el estado: " + error.message,
          "error"
        );

      } finally {
        trabajando = false;
      }
    }

    async function eliminarRegistro(id) {
      if (trabajando) {
        return;
      }

      if (!confirm(
        "¿Seguro que quieres eliminar este avistamiento? Esta acción no se puede deshacer."
      )) {
        return;
      }

      trabajando = true;

      try {
        const { data: usuarioData, error: usuarioError } =
          await cliente.auth.getUser();

        if (usuarioError) {
          throw usuarioError;
        }

        const rol = await obtenerRolModeracion(usuarioData.user);

        if (!rol) {
          throw new Error(
            "No tienes autorización para moderar avistamientos."
          );
        }

        const { error } = await cliente
          .from("avistamientos")
          .delete()
          .eq("id", id);

        if (error) {
          throw error;
        }

        mostrarMensaje(
          mensajeAdmin,
          "Avistamiento eliminado correctamente.",
          "ok"
        );

        await cargarAvistamientos();

      } catch (error) {
        mostrarMensaje(
          mensajeAdmin,
          "No se pudo eliminar el registro: " + error.message,
          "error"
        );

      } finally {
        trabajando = false;
      }
    }

    /* FILTROS DE BOTONES POR ESTADO */
    document.querySelectorAll("[data-filtro]").forEach(boton => {
      boton.addEventListener("click", function() {
        filtroActual = this.dataset.filtro;
        pintarLista();
      });
    });

    /* FILTRADO DINÁMICO POR DESPLEGABLES */
    filtroAeropuerto.addEventListener("change", function() {
      aeropuertoSeleccionado = this.value;
      pintarLista();
    });

    filtroCategoria.addEventListener("change", function() {
      categoriaSeleccionada = this.value;
      pintarLista();
    });

    /* BOTÓN ACTUALIZAR */
    document.getElementById("btnActualizar").addEventListener(
      "click",
      async function() {
        if (trabajando) {
          return;
        }

        await cargarAvistamientos();
      }
    );

    /* CERRAR SESIÓN */
    document.getElementById("btnSalir").addEventListener(
      "click",
      async function() {
        const { error } = await cliente.auth.signOut();

        if (error) {
          mostrarMensaje(
            mensajeAdmin,
            "No se pudo cerrar la sesión: " + error.message,
            "error"
          );
          return;
        }

        registros = [];
        rolActual = null;
        filtroActual = "todos";
        aeropuertoSeleccionado = "";
        categoriaSeleccionada = "";
        filtroAeropuerto.value = "";
        filtroCategoria.value = "";

        lista.textContent = "";
        resumen.textContent = "Sesión cerrada.";
        rolSesion.textContent = "";

        panelAdmin.classList.add("oculto");
        panelLogin.classList.remove("oculto");

        document.getElementById("password").value = "";

        mostrarMensaje(
          mensajeLogin,
          "Has cerrado la sesión correctamente.",
          "ok"
        );
      }
    );

    /* INICIALIZAR PANEL */
    iniciarPanel();
  </script>

  <!-- SERVICE WORKER -->
  <script>
    if (
      "serviceWorker" in navigator &&
      window.location.protocol.startsWith("http") &&
      !window.location.href.startsWith("blob:")
    ) {
      window.addEventListener("load", () => {
        try {
          navigator.serviceWorker.register("./sw.js")
            .then(reg => {
              console.log(
                "Service Worker cargado con éxito:",
                reg.scope
              );
            })
            .catch(err => {
              console.warn(
                "Service Worker no activo:",
                err.message || err
              );
            });
        } catch (err) {
          console.warn(
            "Omitiendo Service Worker:",
            err.message || err
          );
        }
      });
    }
  </script>

</body>
</html>
