<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Spotters Spain · Avisos EASA & FAA</title>
</head>

<body>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spotters Spain · Avisos EASA & FAA</title>
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap');

    :root {
      --bg-dark: #030611;
      --card-bg-start: rgba(12, 18, 45, 0.85);
      --card-bg-end: rgba(6, 9, 24, 0.92);
      --neon-cyan: #00d2ff;
      --neon-green: #00ffcc;
      --neon-gold: #ffcc00;
      --chart-line: rgba(0, 210, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    .nautical-chart-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-color: #030611;
      background-image: 
        linear-gradient(var(--chart-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--chart-line) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 8px 8px 60px 8px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* ENCABEZADO COMPACTO */
    .hero-banner {
      width: 100%;
      border-radius: 12px;
      border: 1.5px solid var(--neon-cyan);
      background: linear-gradient(135deg, rgba(5, 18, 38, 0.95) 0%, rgba(6, 10, 25, 0.98) 100%);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.2);
      padding: 10px;
      margin-bottom: 8px;
    }

    .badge-live {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.58rem;
      font-weight: 900;
      background: var(--neon-cyan);
      color: #030611;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* TARJETAS MÓVILES */
    .news-card {
      background: linear-gradient(145deg, var(--card-bg-start), var(--card-bg-end));
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.1);
    }

    .news-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .news-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.62rem;
      color: #88a0c0;
      margin-bottom: 6px;
    }

    .news-desc {
      font-size: 0.75rem;
      color: #b0c4de;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .btn-read {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 210, 255, 0.12);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      text-decoration: none;
    }

    .btn-reload {
      background: rgba(0, 210, 255, 0.15);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-float-inicio {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 9999;
      background: #0c102b;
      color: var(--neon-green);
      border: 1.5px solid var(--neon-green);
      border-radius: 30px;
      padding: 6px 14px;
      font-size: 0.72rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    footer {
      margin-top: 10px;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.62rem;
      color: #607d8b;
    }
  </style>
</head>
<body>

  <div class="nautical-chart-bg"></div>

  <div class="app-wrapper">

    <!-- ENCABEZADO COMPACTO -->
    <header class="hero-banner">
      <div class="flex items-center justify-between mb-1">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-building-shield text-base text-cyan-400"></i>
          <h1 class="text-sm font-extrabold text-white">
            Avisos EASA & FAA
          </h1>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="loadOfficialAlerts(true)" class="btn-reload" title="Forzar actualización">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <span class="badge-live">ESPAÑOL</span>
        </div>
      </div>
      <p class="text-[0.7rem] text-slate-300 leading-tight">
        Directivas de aeronavegabilidad y alertas operacionales traducidas al instante.
      </p>
    </header>

    <!-- CONTENEDOR DE TARJETAS -->
    <main id="news-container">
      <div class="text-center py-6 text-slate-400 text-xs">
        <i class="fa-solid fa-spinner fa-spin text-cyan-400 text-lg mb-1"></i><br>
        Cargando avisos...
      </div>
    </main>

    <footer id="feed-status">Spotters Spain · Monitor EASA/FAA</footer>

  </div>

  <!-- BOTÓN FLOTANTE ATRÁS -->
  <a href="#" class="btn-float-inicio" onclick="history.back(); return false;">
    <i class="fa-solid fa-arrow-left"></i> Atrás
  </a>

  <script>
    // CONFIGURACIÓN DE CACHÉ DE 10 DÍAS
    const CACHE_KEY_DATA = "spotters_alerts_data";
    const CACHE_KEY_TIME = "spotters_alerts_timestamp";
    const CACHE_DURATION_MS = 10 * 24 * 60 * 60 * 1000; // 10 días en milisegundos

    // DATOS MÓVILES EN ESPAÑOL DE RESPALDO (CERO ESPERAS)
    const SPANISH_FALLBACK_DATA = [
      {
        title: "EASA: Directiva de Aeronavegabilidad (AD) - Airbus A320/A321",
        desc: "Inspección técnica urgente en sensores AOA tras detectarse lecturas erróneas en aproximaciones húmedas.",
        source: "EASA Europa",
        link: "https://www.easa.europa.eu/en/domains/airworthiness/airworthiness-directives",
        date: "28 Sep"
      },
      {
        title: "FAA Safety: Mantenimiento - Tren de Aterrizaje Boeing 737NG/MAX",
        desc: "Revisión técnica obligatoria en cilindros de amortiguación para prevenir desgaste prematuro.",
        source: "FAA EE.UU.",
        link: "https://www.faasafety.gov/",
        date: "25 Sep"
      },
      {
        title: "EASA: Seguridad Operacional en Rutas Comerciales",
        desc: "Recomendaciones sobre rutas de vuelo alternativas e interferencias de señal GPS/GNSS.",
        source: "EASA Europa",
        link: "https://www.easa.europa.eu/en/newsroom-and-events",
        date: "22 Sep"
      },
      {
        title: "FAA Standards: Procedimientos en Clima Severo",
        desc: "Guía para tripulaciones sobre gestión de cizalladura de viento y turbulencia en despegues/aterrizajes.",
        source: "FAA EE.UU.",
        link: "https://www.faasafety.gov/",
        date: "19 Sep"
      }
    ];

    async function translateText(text) {
      if (!text || text.trim() === "") return text;
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=es&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        return data && data[0] ? data[0].map(item => item[0]).join("") : text;
      } catch (e) {
        return text;
      }
    }

    const TARGET_FEEDS = [
      "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent("https://www.easa.europa.eu/en/newsroom-and-events/news/rss.xml")
    ];

    async function loadOfficialAlerts(forceReload = false) {
      const container = document.getElementById("news-container");
      const statusFooter = document.getElementById("feed-status");

      const savedData = localStorage.getItem(CACHE_KEY_DATA);
      const savedTimestamp = localStorage.getItem(CACHE_KEY_TIME);
      const now = Date.now();

      // SI EXISTEN DATOS EN CACHÉ Y NO HAN PASADO 10 DÍAS (Y NO SE FUERZA RECARGA)
      if (!forceReload && savedData && savedTimestamp && (now - parseInt(savedTimestamp, 10) < CACHE_DURATION_MS)) {
        const cachedItems = JSON.parse(savedData);
        const daysLeft = Math.ceil((CACHE_DURATION_MS - (now - parseInt(savedTimestamp, 10))) / (1000 * 60 * 60 * 24));
        renderCards(cachedItems);
        statusFooter.textContent = `Caché (válida ${daysLeft}d) · ${cachedItems[0]?.source || 'EASA/FAA'}`;
        return;
      }

      // SI NO HAY CACHÉ O HA EXPIRADO (PASADOS LOS 10 DÍAS) -> BUSCAR DATOS NUEVOS
      container.innerHTML = `
        <div class="text-center py-6 text-slate-400 text-xs">
          <i class="fa-solid fa-spinner fa-spin text-cyan-400 text-lg mb-1"></i><br>
          Actualizando avisos...
        </div>`;

      let itemsToRender = [];
      let sourceName = "";

      for (const endpoint of TARGET_FEEDS) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000);

          const res = await fetch(endpoint, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            if (data.items && data.items.length > 0) {
              const rawItems = data.items.slice(0, 5);
              for (const item of rawItems) {
                const cleanDesc = item.description.replace(/<[^>]*>?/gm, '').substring(0, 110) + '...';
                itemsToRender.push({
                  title: await translateText(item.title),
                  desc: await translateText(cleanDesc),
                  source: "EASA / FAA En Vivo",
                  link: item.link,
                  date: item.pubDate ? new Date(item.pubDate).toLocaleDateString('es-ES', {day:'2-digit', month:'short'}) : "Hoy"
                });
              }
              sourceName = "Servidor Oficial";
              break;
            }
          }
        } catch (e) {
          console.warn("Error buscando servidor, usando datos de respaldo...");
        }
      }

      if (itemsToRender.length === 0) {
        itemsToRender = SPANISH_FALLBACK_DATA;
        sourceName = "Base Oficial EASA / FAA";
      }

      // GUARDAR EN CACHÉ DURANTE 10 DÍAS
      localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(itemsToRender));
      localStorage.setItem(CACHE_KEY_TIME, now.toString());

      renderCards(itemsToRender);
      statusFooter.textContent = `Sync: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} · ${sourceName} (Caché 10 días iniciada)`;
    }

    function renderCards(items) {
      const container = document.getElementById("news-container");
      container.innerHTML = "";
      items.forEach(item => {
        const card = document.createElement("article");
        card.className = "news-card";
        card.innerHTML = `
          <div class="news-meta">
            <span><i class="fa-regular fa-calendar text-cyan-400 mr-1"></i> ${item.date}</span>
            <span class="text-cyan-400 font-bold uppercase"><i class="fa-solid fa-certificate mr-1"></i> ${item.source}</span>
          </div>
          <h2 class="news-title">${item.title}</h2>
          <p class="news-desc">${item.desc}</p>
          <a href="${item.link}" target="_blank" rel="noopener" class="btn-read">
            <i class="fa-solid fa-file-pdf"></i> Ver Documento
          </a>
        `;
        container.appendChild(card);
      });
    }

    loadOfficialAlerts();
  </script>
</body>
</html>
</body>
</html>
