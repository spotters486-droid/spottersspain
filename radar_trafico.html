<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spotters Spain · Radar BCN & Heavy Scanner</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #050814;
      --panel-bg: linear-gradient(145deg, #0c102b, #070a1a);
      --neon-cyan: #00d2ff;
      --neon-green: #00ffcc;
      --neon-red: #ff0055;
      --neon-gold: #ffcc00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* HEADER ULTRA-COMPACTO */
    header {
      background: linear-gradient(180deg, #070a1a 0%, #0c102b 100%);
      padding: 4px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
      flex-wrap: nowrap;
      gap: 6px;
      z-index: 10;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    header h1 {
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--neon-cyan);
      text-shadow: 0 0 6px rgba(0, 210, 255, 0.6);
      transition: all 0.5s ease;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    header h1 i.radar-icon {
      animation: spin-radar 6s linear infinite;
    }

    header h1 span.live-badge {
      background: var(--neon-red);
      color: white;
      font-size: 0.55rem;
      padding: 1px 5px;
      border-radius: 999px;
      font-weight: bold;
      box-shadow: 0 0 6px rgba(255, 0, 85, 0.8);
      animation: pulse-live 1.8s infinite;
    }

    /* HEAVY DETECTED RGB NEON GLOW */
    header.heavy-detected {
      border-bottom-color: var(--neon-gold);
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
    }

    header.heavy-detected h1 {
      background: linear-gradient(90deg, #ff0055, #ffcc00, #00ffcc, #00d2ff, #ff0055);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow-glow 3s ease infinite, pulse-heavy-text 1.2s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 8px rgba(255, 204, 0, 0.8));
    }

    .links {
      display: flex;
      gap: 6px;
    }

    .links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 4px rgba(0, 210, 255, 0.2);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .links a:hover {
      background: var(--neon-cyan);
      color: #000000;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    /* HEAVY SELECTOR BAR ULTRA-COMPACTA */
    .heavy-selector-bar {
      background: #03050d;
      padding: 3px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    .heavy-selector-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .heavy-tag-title {
      font-size: 0.65rem;
      font-weight: 900;
      color: var(--neon-gold);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 6px;
      border-right: 1px solid rgba(255, 204, 0, 0.3);
      white-space: nowrap;
    }

    .btn-heavy-model {
      background: rgba(255, 204, 0, 0.08);
      color: var(--neon-gold);
      border: 1px solid var(--neon-gold);
      padding: 3px 10px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .btn-heavy-model:hover, .btn-heavy-model.active {
      background: var(--neon-gold);
      color: #000000;
      box-shadow: 0 0 10px var(--neon-gold);
    }

    /* ESTILO PARA LOS DESPLEGABLES */
    .select-heavy-model {
      background: #070a1a;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 3px 8px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 4px rgba(0, 210, 255, 0.2);
      transition: all 0.25s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .select-heavy-model:hover, .select-heavy-model:focus, .select-heavy-model.active {
      background: rgba(0, 210, 255, 0.15);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .select-heavy-model option {
      background-color: #070a1a;
      color: #ffffff;
      font-weight: 600;
    }

    .heavy-ticker {
      font-size: 0.68rem;
      font-weight: 700;
      color: #7a8b9e;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    /* MAIN CONTAINER - MÁXIMO ESPACIO PARA EL MAPA */
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
      min-height: 0;
    }

    .panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100%;
      min-height: 0;
      position: relative;
      background: var(--bg-color);
      overflow: hidden;
    }

    /* PANEL HEADER */
    .panel-header {
      background: #03050d;
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 210, 255, 0.3);
      gap: 8px;
    }

    .panel-header .left {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--neon-green);
      text-shadow: 0 0 4px rgba(0, 255, 204, 0.5);
      white-space: nowrap;
    }

    .panel-header .badge {
      font-size: 0.6rem;
      background: rgba(0, 255, 204, 0.15);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      box-shadow: 0 0 4px rgba(0, 255, 204, 0.3);
    }

    .btn-fullscreen {
      background: var(--neon-green);
      color: #000000;
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.25s ease;
      box-shadow: 0 0 8px var(--neon-green);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .btn-fullscreen:hover {
      background: #ffffff;
      box-shadow: 0 0 14px #ffffff;
    }

    .panel iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
      transform: translateZ(0);
      will-change: transform;
    }

    .panel.fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
    }

    body.fs-active header,
    body.fs-active .heavy-selector-bar,
    body.fs-active footer,
    body.fs-active .btn-float-inicio {
      display: none;
    }

    footer {
      background: #03050d;
      padding: 2px 8px;
      font-size: 0.65rem;
      color: #7a8b9e;
      text-align: center;
      border-top: 1px solid rgba(0, 210, 255, 0.2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-float-inicio {
      position: fixed;
      bottom: calc(12px + env(safe-area-inset-bottom));
      right: max(12px, env(safe-area-inset-right));
      z-index: 99999;
      background: #0c102b;
      color: #00ffcc;
      border: 1.5px solid #00ffcc;
      border-radius: 50px;
      padding: 5px 12px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.4), inset 0 0 6px rgba(0, 255, 204, 0.2);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-float-inicio:hover, .btn-float-inicio:active {
      background: #00ffcc;
      color: #050814;
      box-shadow: 0 0 16px rgba(0, 255, 204, 0.9);
    }

    @keyframes spin-radar {
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse-live {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes rainbow-glow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulse-heavy-text {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }

    @media (max-width: 600px) {
      header h1 { font-size: 0.85rem; }
      .heavy-selector-bar { padding: 4px 6px; }
      .btn-fullscreen { font-size: 0.65rem; padding: 2px 6px; }
      .btn-float-inicio { font-size: 0.65rem; padding: 4px 10px; }
    }
  </style>
</head>
<body>

  <!-- FLOATING BACK BUTTON -->
  <button class="btn-float-inicio" onClick="volverAtras()">
    <i class="fa-solid fa-arrow-left"></i> Atrás
  </button>

  <!-- HEADER WITH DYNAMIC COLOR ANIMATION -->
  <header id="main-header">
    <h1 id="main-title">
      <i class="fa-solid fa-crosshairs radar-icon"></i> Spotters Spain
      <span class="live-badge" id="live-tag">LIVE</span>
    </h1>

    <div class="links">
      <a href="https://www.flightradar24.com/41.30,2.08/11" target="_blank" rel="noopener">
        <i class="fa-solid fa-plane-departure"></i> FR24
      </a>
    </div>
  </header>

  <!-- HEAVY TRAFFIC SELECTOR BAR -->
  <div class="heavy-selector-bar">
    <div class="heavy-selector-group">
      <div class="heavy-tag-title">
        <i class="fa-solid fa-plane"></i> FILTRO:
      </div>
      <button class="btn-heavy-model active" id="btn-all" onClick="filterHeavyModel('ALL')">
        <i class="fa-solid fa-globe"></i> Todo
      </button>
      <button class="btn-heavy-model" id="btn-heavy" onClick="filterHeavyModel('HEAVY_ALL')">
        <i class="fa-solid fa-layer-group"></i> Heavies
      </button>

      <!-- DESPLEGABLE DE AEROLÍNEAS -->
      <select class="select-heavy-model" id="select-airline-filter" onChange="filterHeavyModel('AIRLINE_FILTER')">
        <option value="ALL_AIRLINES" selected>🏢 Aerolínea: Todas</option>
        <option value="VLG">💛 Vueling (VLG)</option>
        <option value="IBE">🔴 Iberia (IBE)</option>
        <option value="RYR">💙 Ryanair (RYR)</option>
        <option value="AEA">🌐 Air Europa (AEA)</option>
        <option value="LVL">🟦 Level (LVL)</option>
        <option value="UAE">🇦🇪 Emirates (UAE)</option>
        <option value="QTR">🇶🇦 Qatar Airways (QTR)</option>
        <option value="AAL">🇺🇸 American Airlines (AAL)</option>
        <option value="DAL">🇺🇸 Delta Air Lines (DAL)</option>
        <option value="UAL">🇺🇸 United Airlines (UAL)</option>
        <option value="EJU">🟧 EasyJet (EJU)</option>
        <option value="AFR">🇫🇷 Air France (AFR)</option>
        <option value="DLH">🇩🇪 Lufthansa (DLH)</option>
        <option value="SWR">🇨🇭 Swiss (SWR)</option>
        <option value="BAW">🇬🇧 British Airways (BAW)</option>
        <option value="THY">🇹🇷 Turkish Airlines (THY)</option>
        <option value="WZZ">🟣 Wizz Air (WZZ)</option>
        <option value="IBB">🇮🇨 Binter Canarias (IBB)</option>
      </select>

      <!-- DESPLEGABLE DE ALTITUD -->
      <select class="select-heavy-model" id="select-alt-filter" onChange="filterHeavyModel('ALT_FILTER')">
        <option value="ALL_ALT" selected>✈️ Altura: Todas</option>
        <option value="3000">🛬 ≤ 3.000 ft</option>
        <option value="6000">🛬 ≤ 6.000 ft</option>
        <option value="9000">🛫 ≤ 9.000 ft</option>
        <option value="15000">✈️ ≤ 15.000 ft</option>
        <option value="HIGH_ALT">☁️ ≥ 20.000 ft</option>
      </select>
    </div>

    <div class="heavy-ticker" id="heavy-ticker-info">
      <i class="fa-solid fa-radar"></i>
      <span id="scanner-text">Escaneando España...</span>
    </div>
  </div>

  <!-- RADAR CONTAINER -->
  <div class="container">
    <div class="panel" id="traffic-panel">
      <div class="panel-header">
        <div class="left">
          <i class="fa-solid fa-location-dot"></i>
          <span>TMA BCN/ESP</span>
          <span class="badge" id="filter-badge">SATÉLITE (BCN)</span>
        </div>

        <button class="btn-fullscreen" id="btn-fs" onClick="toggleFullscreen()">
          <i class="fa-solid fa-expand" id="fs-icon"></i>
          <span id="fs-text">Ampliar Mapa</span>
        </button>
      </div>

      <!-- MAP IFRAME DEFAULT TO BARCELONA ALL ALTITUDES -->
      <iframe
        id="traffic-iframe"
        src="https://globe.adsbexchange.com/?lat=41.30&lon=2.08&zoom=11&tempTrails=1&largeMode=1&hideSidebar&hideButtons&hideHeader&mapType=hybrid"
        title="Tráfico aéreo BCN Satélite"
        allowfullscreen
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope"
        loading="eager">
      </iframe>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    BCN · Satélite · Spotters Spain
  </footer>

  <script>
    const baseUrl = "https://globe.adsbexchange.com/?lat=41.30&lon=2.08&zoom=11&tempTrails=1&largeMode=1&hideSidebar&hideButtons&hideHeader&mapType=hybrid";
    const heavyCallsignPrefixes = ['IBE', 'UAE', 'QTR', 'AAL', 'DAL', 'UAL', 'SIA', 'KAL', 'LVL', 'THY', 'ETH', 'SWR', 'AFR', 'BAW', 'LAN', 'TAM', 'ARG', 'AVA', 'AEA'];

    function filterHeavyModel(modelKey) {
      const iframe = document.getElementById('traffic-iframe');
      const badge = document.getElementById('filter-badge');
      const altSelect = document.getElementById('select-alt-filter');
      const airlineSelect = document.getElementById('select-airline-filter');

      document.querySelectorAll('.btn-heavy-model').forEach(btn => btn.classList.remove('active'));
      altSelect.classList.remove('active');
      airlineSelect.classList.remove('active');

      let targetUrl = baseUrl;

      if (modelKey === 'HEAVY_ALL') {
        document.getElementById('btn-heavy').classList.add('active');
        airlineSelect.value = 'ALL_AIRLINES';
        altSelect.value = 'ALL_ALT';
        badge.textContent = 'HEAVIES (A5)';
        targetUrl = `${baseUrl}&filterCategory=A5`;
      } else if (modelKey === 'AIRLINE_FILTER') {
        const airlineVal = airlineSelect.value;
        altSelect.value = 'ALL_ALT';

        if (airlineVal === 'ALL_AIRLINES') {
          document.getElementById('btn-all').classList.add('active');
          badge.textContent = 'SATÉLITE (BCN)';
          targetUrl = baseUrl;
        } else {
          airlineSelect.classList.add('active');
          const airlineText = airlineSelect.options[airlineSelect.selectedIndex].text.split('(')[0].trim();
          badge.textContent = `AEROLÍNEA: ${airlineText.toUpperCase()}`;
          targetUrl = `${baseUrl}&filterCallsign=${airlineVal}`;
        }
      } else if (modelKey === 'ALT_FILTER') {
        const altVal = altSelect.value;
        airlineSelect.value = 'ALL_AIRLINES';

        if (altVal === 'ALL_ALT') {
          document.getElementById('btn-all').classList.add('active');
          badge.textContent = 'SATÉLITE (BCN)';
          targetUrl = baseUrl;
        } else if (altVal === 'HIGH_ALT') {
          altSelect.classList.add('active');
          badge.textContent = 'ALT ≥ 20.000 FT';
          targetUrl = "https://globe.adsbexchange.com/?lat=41.30&lon=2.08&zoom=10&filterAltMin=20000&tempTrails=1&largeMode=1&hideSidebar&hideButtons&hideHeader&mapType=hybrid";
        } else {
          altSelect.classList.add('active');
          badge.textContent = `ALT ≤ ${altVal} FT`;
          targetUrl = `https://globe.adsbexchange.com/?lat=41.30&lon=2.08&zoom=10&filterAltMax=${altVal}&tempTrails=1&largeMode=1&hideSidebar&hideButtons&hideHeader&mapType=hybrid`;
        }
      } else {
        document.getElementById('btn-all').classList.add('active');
        airlineSelect.value = 'ALL_AIRLINES';
        altSelect.value = 'ALL_ALT';
        badge.textContent = 'SATÉLITE (BCN)';
        targetUrl = baseUrl;
      }

      try {
        iframe.contentWindow.location.replace(targetUrl);
      } catch (e) {
        iframe.src = targetUrl;
      }
    }

    // Escáner automático para la alerta visual de Heavies en la cabecera
    async function scanSpainHeavyAircraft() {
      try {
        const rawUrl = 'https://opensky-network.org/api/states/all?lamin=35.50&lomin=-9.50&lamax=43.80&lomax=4.30';
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rawUrl);

        const response = await fetch(proxyUrl, { signal: AbortSignal.timeout(5000) });
        if (!response.ok) return;

        const data = await response.json();
        if (!data || !data.states) return;

        let heavyCount = 0;
        let sampleCallsign = '';

        for (let flight of data.states) {
          const callsign = (flight[1] || '').trim();
          const lat = flight[6];
          const lon = flight[5];

          const isHeavy = heavyCallsignPrefixes.some(prefix => callsign.startsWith(prefix));

          if (isHeavy && lat && lon) {
            heavyCount++;
            if (!sampleCallsign) sampleCallsign = callsign;
          }
        }

        const mainHeader = document.getElementById('main-header');
        const liveTag = document.getElementById('live-tag');
        const scannerText = document.getElementById('scanner-text');

        if (heavyCount > 0) {
          mainHeader.classList.add('heavy-detected');
          if (liveTag) liveTag.textContent = 'HEAVY';
          if (scannerText) scannerText.textContent = `${heavyCount} Heavy: ${sampleCallsign}`;
        } else {
          mainHeader.classList.remove('heavy-detected');
          if (liveTag) liveTag.textContent = 'LIVE';
          if (scannerText) scannerText.textContent = 'Escaneando España...';
        }

      } catch (err) {
        console.log('Error escaneando Heavies:', err);
      }
    }

    function volverAtras() {
      if (document.referrer && document.referrer !== window.location.href) {
        window.location.href = document.referrer;
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }

    function toggleFullscreen() {
      const panel = document.getElementById('traffic-panel');
      const btnText = document.getElementById('fs-text');
      const btnIcon = document.getElementById('fs-icon');
      const isFullscreen = panel.classList.contains('fullscreen');

      if (isFullscreen) {
        panel.classList.remove('fullscreen');
        document.body.classList.remove('fs-active');
        btnText.textContent = 'Ampliar Mapa';
        btnIcon.className = 'fa-solid fa-expand';

        if (document.exitFullscreen && document.fullscreenElement) {
          document.exitFullscreen().catch(err => console.log(err));
        }
      } else {
        panel.classList.add('fullscreen');
        document.body.classList.add('fs-active');
        btnText.textContent = 'Restaurar Mapa';
        btnIcon.className = 'fa-solid fa-compress';

        if (panel.requestFullscreen) {
          panel.requestFullscreen().catch(err => console.log(err));
        }
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const panel = document.getElementById('traffic-panel');
        if (panel.classList.contains('fullscreen')) {
          toggleFullscreen();
        }
      }
    });

    scanSpainHeavyAircraft();
    setInterval(scanSpainHeavyAircraft, 15000);
  </script>
</body>
</html>
